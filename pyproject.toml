[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-kubernetes-agentic-ops"
version = "0.1.0"
description = "Event-driven, safety-first incident orchestration for Kubernetes and AKS."
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17",
    "fastapi>=0.115",
    "httpx>=0.27",
    "kubernetes>=30.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
