apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-ops
  namespace: agentic-ops
  annotations:
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-ops-read
  namespace: agentic-ops
subjects:
  - kind: ServiceAccount
    name: agentic-ops
    namespace: agentic-ops
roleRef:
  kind: ClusterRole
  name: agentic-ops-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-ops-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-ops
  namespace: agentic-ops
spec:
  selector:
    app: agentic-ops
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ops
  namespace: agentic-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-ops
  template:
    metadata:
      labels:
        app: agentic-ops
        azure.workload.identity/use: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentic-ops
      containers:
        - name: orchestrator
          image: "${AGENTIC_OPS_IMAGE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          env:
            - name: AZURE_AI_FOUNDRY_ENDPOINT
              value: "${AZURE_AI_FOUNDRY_ENDPOINT}"
            - name: AZURE_AI_FOUNDRY_DEPLOYMENT
              value: "${AZURE_AI_FOUNDRY_DEPLOYMENT}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
